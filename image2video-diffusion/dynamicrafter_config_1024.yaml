# • Fast settings: ~1-2 minutes
# • Balanced: ~2-4 minutes  
# • Maximum quality: ~4-8 minutes
#
# MEMORY REQUIREMENTS:
# • CRITICAL: perframe_ae: true (prevents OOM errors)
# • Keep batch_size: 1 (higher will crash)
# • Monitor GPU memory usage
