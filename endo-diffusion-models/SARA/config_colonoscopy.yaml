# =============================================================================
# COLONOSCOPY NAVIGATION CONFIGURATION
# =============================================================================
# Optimized for general colon navigation and exploration
# Focus: Smooth camera movement through healthy colon tissue

# -----------------------------------------------------------------------------
# PATH CONFIGURATION  
# -----------------------------------------------------------------------------
ckpt: # Model checkpoint path (overridden by --ckpt)
save_img_path: "./SARA/results/colonoscopy" 
pretrained_model_path: 

# -----------------------------------------------------------------------------
# MODEL ARCHITECTURE CONFIGURATION
# -----------------------------------------------------------------------------
model: EnDora-XL/2          
num_frames: 16              # Fixed to match checkpoint architecture
image_size: 128             # Fixed to match checkpoint architecture
frame_interval: 2           
fixed_spatial: False        
attention_bias: True        
learn_sigma: True          
extras: 1                   
num_classes:                

# -----------------------------------------------------------------------------
# PERFORMANCE & OPTIMIZATION
# -----------------------------------------------------------------------------
use_compile: True           
use_fp16: True              
per_proc_batch_size: 4      # Optimized batch size

# -----------------------------------------------------------------------------
# SAMPLING CONFIGURATION
# -----------------------------------------------------------------------------
seed: 42                    # Fixed seed for reproducible colonoscopy navigation
sample_method: 'ddpm'       
num_sampling_steps: 350     # Higher steps for smoother motion
cfg_scale: 12.0             # Very strong guidance to enforce first frame consistency
negative_name:              

# -----------------------------------------------------------------------------
# COLONOSCOPY CONTENT PROMPTS
# -----------------------------------------------------------------------------
use_text_guidance: True     
prompt: "the first frame must be the current image. stay coherent with input image, show same healthy colon tissue, maintain exact same view"
negative_prompt: "different content, new polyps, changed anatomy, artifacts, blurry"

# -----------------------------------------------------------------------------
# VIDEO OUTPUT CONFIGURATION
# -----------------------------------------------------------------------------
fps: 10                     # Smooth clinical examination pace
video_quality: 10           # Maximum quality
save_individual_frames: False 
video_format: "mp4"         

# -----------------------------------------------------------------------------
# ADVANCED GENERATION PARAMETERS
# -----------------------------------------------------------------------------
temporal_coherence: 1.2     # Enhanced smoothness for navigation
motion_strength: 0.8        # Controlled, gentle motion
conditioning_strength: 1.5  # Maximum image conditioning to enforce first frame
noise_schedule: "cosine"    

# -----------------------------------------------------------------------------
# DISTRIBUTED SAMPLING
# -----------------------------------------------------------------------------
num_fvd_samples: 3125       
ddp_backend: "nccl"         
