# =============================================================================
# COMPLEX POLYP EXAMINATION CONFIGURATION
# =============================================================================
# Optimized for advanced polyp morphology and surface pattern analysis
# Focus: Detailed inspection with enhanced surface characterization

# -----------------------------------------------------------------------------
# PATH CONFIGURATION  
# -----------------------------------------------------------------------------
ckpt: # Model checkpoint path (overridden by --ckpt)
save_img_path: "./SARA/results/polip1" 
pretrained_model_path: 

# -----------------------------------------------------------------------------
# MODEL ARCHITECTURE CONFIGURATION
# -----------------------------------------------------------------------------
model: EnDora-XL/2          
num_frames: 16              # Fixed to match checkpoint architecture
image_size: 128             # Fixed to match checkpoint architecture
frame_interval: 2           
fixed_spatial: False        
attention_bias: True        
learn_sigma: True          
extras: 1                   
num_classes:                

# -----------------------------------------------------------------------------
# PERFORMANCE & OPTIMIZATION
# -----------------------------------------------------------------------------
use_compile: True           
use_fp16: True              
per_proc_batch_size: 4      

# -----------------------------------------------------------------------------
# SAMPLING CONFIGURATION
# -----------------------------------------------------------------------------
seed: 456                   # Fixed seed for reproducible examination
sample_method: 'ddpm'       
num_sampling_steps: 450     # Maximum steps for finest details
cfg_scale: 12.0             # Very strong guidance to enforce first frame consistency
negative_name:              

# -----------------------------------------------------------------------------
# COMPLEX POLYP CONTENT PROMPTS
# -----------------------------------------------------------------------------
use_text_guidance: True     
prompt: "the first frame must be the current image. stay coherent with input image, show exact same complex polyp, maintain identical polyp morphology"
negative_prompt: "different polyp, changed morphology, new features, artifacts, blurry"

# -----------------------------------------------------------------------------
# VIDEO OUTPUT CONFIGURATION
# -----------------------------------------------------------------------------
fps: 8                      # Careful, methodical pace
video_quality: 10           
save_individual_frames: False 
video_format: "mp4"         

# -----------------------------------------------------------------------------
# ADVANCED GENERATION PARAMETERS
# -----------------------------------------------------------------------------
temporal_coherence: 1.4     # Maximum coherence for complex features
motion_strength: 0.6        # Very controlled movement
conditioning_strength: 1.5  # Maximum image conditioning to enforce first frame
noise_schedule: "cosine"    

# -----------------------------------------------------------------------------
# DISTRIBUTED SAMPLING
# -----------------------------------------------------------------------------
num_fvd_samples: 3125       
ddp_backend: "nccl"         
