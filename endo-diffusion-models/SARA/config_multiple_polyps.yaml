# =============================================================================
# MULTIPLE POLYPS EXAMINATION CONFIGURATION
# =============================================================================
# Optimized for comprehensive multi-lesion assessment and spatial navigation
# Focus: Systematic examination of multiple polyps with spatial awareness

# -----------------------------------------------------------------------------
# PATH CONFIGURATION  
# -----------------------------------------------------------------------------
# Note: These paths are typically overridden by command-line arguments
ckpt: # Model checkpoint path (overridden by --ckpt)
save_img_path: "./SARA/results/multiple_polyps" 
pretrained_model_path: 

# -----------------------------------------------------------------------------
# MODEL ARCHITECTURE CONFIGURATION
# -----------------------------------------------------------------------------
model: EnDora-XL/2          
num_frames: 16              # Fixed to match checkpoint architecture
image_size: 128             # Fixed to match checkpoint architecture
frame_interval: 2           
fixed_spatial: False        
attention_bias: True        
learn_sigma: True          
extras: 1                   
num_classes:                

# -----------------------------------------------------------------------------
# PERFORMANCE & OPTIMIZATION
# -----------------------------------------------------------------------------
use_compile: True           
use_fp16: True              
per_proc_batch_size: 4      # Optimized batch size

# -----------------------------------------------------------------------------
# SAMPLING CONFIGURATION
# -----------------------------------------------------------------------------
seed: 789                   # Fixed seed for reproducible multi-polyp scene
sample_method: 'ddpm'       
num_sampling_steps: 500     # Maximum steps for complex multi-object scene
cfg_scale: 12.0             # Very strong guidance to enforce first frame consistency
negative_name:              

# -----------------------------------------------------------------------------
# MULTIPLE POLYPS CONTENT PROMPTS
# -----------------------------------------------------------------------------
use_text_guidance: True     
prompt: "the first frame must be the current image. stay coherent with input image, show exact same multiple polyps, maintain all visible polyps in same positions"
negative_prompt: "missing polyps, different polyps, changed positions, new lesions, artifacts, blurry"

# -----------------------------------------------------------------------------
# VIDEO OUTPUT CONFIGURATION
# -----------------------------------------------------------------------------
fps: 12                     # Smooth navigation between lesions
video_quality: 10           
save_individual_frames: False 
video_format: "mp4"         

# -----------------------------------------------------------------------------
# ADVANCED GENERATION PARAMETERS
# -----------------------------------------------------------------------------
temporal_coherence: 1.5     # Maximum coherence for complex scene
motion_strength: 1.0        # Balanced motion for systematic coverage
conditioning_strength: 1.5  # Maximum image conditioning to enforce first frame
noise_schedule: "cosine"    

# -----------------------------------------------------------------------------
# DISTRIBUTED SAMPLING
# -----------------------------------------------------------------------------
num_fvd_samples: 3125       
ddp_backend: "nccl"         